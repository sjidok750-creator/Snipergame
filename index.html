  /* ---------- 이벤트 ---------- */
  onShot(){this.ms.shots++;},
  onHit(){/* 명중률 집계는 ms.hits에서 */this.ms.hits++;},
  onBulletMiss(){
    if(this.m&&this.m.type==='oneshot'&&this.state==='playing'&&this.oneStreak>0){
      this.oneStreak=0;HUD.toast('스트릭 리셋!');HUD.quest(CHAPTERS[this.ci].name+' — '+this.m.n,'연속 킬 0 / 5');
    }
  },
  onTargetHit(t){
    if(this.mode!=='tutorial')return;
    this.tutCount++;
    HUD.popup(t.pos.clone().add(V3(0,2,0)),'명중!','gold');
    if(this.tutCount>=this.tutNeed){
      this.tutStep++;
      if(this.tutStep>=3){G.tutorialDone=true;this.win();}
      else this.spawnTutStep();
    }
  },
  onKill(e,head,cause){
    if(this.state!=='playing')return;
    const dist=e.killInfo?e.killInfo.dist:player.pos.distanceTo(e.pos);
    this.ms.kills++;if(head)this.ms.heads++;
    G.stats.kills++;if(head)G.stats.heads++;
    G.stats.longest=Math.max(G.stats.longest,dist|0);
    // 골드: 킬 10 / 헤드샷 +5
    const gold=10+(head?5:0);
    G.gold+=gold;
    HUD.popup(e.pos.clone().add(V3(0,2.2,0)),'+'+gold+'G','coin');
    AE.coin();
    HUD.killfeed((head?'헤드샷':cause==='붕괴'?'붕괴 처치':'처치')+' · '+(dist|0)+'m',head);
    // 멀티킬
    this.mkCount=(this.mkTimer>0)?this.mkCount+1:1;
    this.mkTimer=1.2;
    if(this.mkCount===2){HUD.banner('DOUBLE KILL');AE.banner(2);}
    else if(this.mkCount>=3){HUD.banner('TRIPLE KILL');AE.banner(3);}
    // 킬캠: 100m+ 헤드샷, 5킬당 1회
    if(head&&dist>=100&&G.stats.kills%5===0)player.slowmo(.8);
    vib(head?'head':'hit');
    // 미션별
    const T=this.m?this.m.type:'';
    if(T==='oneshot'){this.oneStreak++;HUD.quest(CHAPTERS[this.ci].name+' — '+this.m.n,'연속 킬 '+this.oneStreak+' / 5');
      if(this.oneStreak>=5)this.win();}
    if(T==='longrange'&&dist>=120){this.lrKills++;HUD.toast('장거리 킬 '+this.lrKills+'/3 ('+(dist|0)+'m)');
      if(this.lrKills>=3)this.win();}
    if(T==='vip'){
      if(e===this.vip)this.win();
      else if(this.guards&&this.guards.includes(e)&&this.vip&&!this.vip.dead&&this.vipTimer<0){
        this.vip.flee=true;this.vipTimer=30;
        HUD.banner('VIP 도주!','30초 내 사살하라');
      }
    }
    if(T==='head'){
      HUD.quest(CHAPTERS[this.ci].name+' — '+this.m.n,'헤드샷 '+this.ms.heads+' / '+this.m.count);
      if(this.ms.heads>=this.m.count)this.win();
    }
  },
  onBlockDestroyed(b){},
  onStructHit(sid){
    if(this.m&&this.m.type==='chain'&&sid.startsWith('tower')){
      const s=world.structs[sid];
      if(s.collapsed)return;
      s.shots++;
      HUD.toast(sid.replace('tower','감시탑 ')+': '+s.shots+' / 3발');
      if(s.shots>3)this.fail('사격 횟수 초과 (구조물당 3발)');
    }
  },
  onStructCollapse(sid){
    if(this.state!=='playing')return;
    if(sid.startsWith('tower')){HUD.banner('구조물 붕괴!');vib('collapse');player.trauma(.5);}
    const T=this.m?this.m.type:'';
    if(T==='demolish'&&sid===this.targetSid)setTimeout(()=>this.win(),800);
    if(T==='chain'&&world.towerTops.every(t=>world.structs[t.sid].collapsed))setTimeout(()=>this.win(),800);
  },
  onHostageHit(){this.fail('인질이 피격되었습니다');},
  onTruckStopped(driver){HUD.banner(driver?'운전병 사살':'차량 파괴');setTimeout(()=>this.win(),600);},
  onBossDown(){HUD.banner('강철거인 격파!');setTimeout(()=>this.win(),1400);},
  onCorpseSeen(){
    if(this.m&&this.m.type==='silent')this.fail('시체가 발견되었습니다');
  },
  onPlayerDamage(){this.ms.dmg++;},
  /* ---------- 진행 체크 ---------- */
  update(dt){
    if(this.state!=='playing')return;
    this.ms.t+=dt;
    if(this.mkTimer>0)this.mkTimer-=dt;
    const T=this.m?this.m.type:'';
    const alive=EnemyMgr.alive().length;
    if(this.mode==='tutorial')return;
    if(this.mode==='endless'){
      if(alive===0&&this.waveT<=0){this.waveT=4;HUD.banner('WAVE '+this.wave+' 클리어');player.hp=player.maxHp;HUD.hp();}
      if(this.waveT>0){this.waveT-=dt;
        if(this.waveT<=0){this.wave++;G.stats.bestWave=Math.max(G.stats.bestWave,this.wave);
          DD.apply(2,this.wave);this.spawnWave();
          HUD.quest('무한 모드 — WAVE '+this.wave,'적 '+EnemyMgr.alive().length+'명');}}
      return;
    }
    switch(T){
      case 'elim':case 'silent':case 'hostage':case 'ammo':
        if(alive===0)this.win();
        if(T==='ammo'&&player.reserve+player.ammo<=0&&bullets.length===0&&alive>0)this.fail('탄약 소진');
        break;
      case 'head':
        if(alive===0&&this.ms.heads<this.m.count)this.fail('헤드샷이 부족합니다');
        break;
      case 'timed':
        this.timeLeft-=dt;HUD.timer(this.timeLeft);
        if(this.ms.kills>=this.m.count)this.win();
        else if(this.timeLeft<=0)this.fail('시간 초과');
        break;
      case 'oneshot':
        if(alive===0&&this.oneStreak<5)this.fail('연속 킬 실패 — 적이 남지 않았다');
        break;
      case 'longrange':
        if(alive===0&&this.lrKills<3)this.fail('120m+ 저격이 부족합니다');
        break;
      case 'vip':
        if(this.vipTimer>0){this.vipTimer-=dt;HUD.timer(this.vipTimer);
          if(this.vipTimer<=0||(this.vip&&Math.abs(this.vip.pos.x)>31))this.fail('VIP가 도주했습니다');}
        break;
      case 'counter':
        if(alive===0)this.win();
        break;
    }
  },
  spawnWave(){
    const n=3+this.wave;
    const types=this.wave<2?['grunt']:this.wave<4?['grunt','runner']:['grunt','runner','heavy'];
    this.spawnField(Math.min(n,10),types);
    if(this.wave>=3&&world.towerTops.length){const t=world.towerTops[this.wave%world.towerTops.length];
      EnemyMgr.spawn('sniper',t.x,t.z,{y:t.y});}
  },
  /* ---------- 승패 ---------- */
  starsEarned(){
    if(this.mode!=='mission')return 0;
    let s=0;
    if(this.ms.t<=this.m.par)s++;
    if(this.ms.shots>0&&this.ms.hits/this.ms.shots>=.6)s++;
    if(this.ms.dmg===0)s++;
    return Math.max(s,1);
  },
  win(){
    if(this.state!=='playing')return;
    this.state='won';
    Music.setState('CALM');AE.fanfare();AE.heartbeat(false);
    HUD.timer(null);HUD.hint(null);
    $('btnPause').classList.add('hide');
    if(this.mode==='tutorial'){
      setTimeout(()=>{showEnd(true,3,'훈련 완료! 이제 실전이다.');},900);
      return;
    }
    const stars=this.starsEarned(),key=this.key();
    const prev=G.stars[key]||0,newStars=Math.max(0,stars-prev);
    G.stars[key]=Math.max(prev,stars);
    let gold=0;
    if(!G.cleared[key])gold+=50*(this.ci+1);       // 미션 완료 50×챕터
    gold+=newStars*20;                              // 신규 별 1개당 +20
    G.cleared[key]=true;
    G.gold+=gold;
    // 전체 클리어 → 무한 모드
    if(!G.allClear&&CHAPTERS.every((c,ci)=>c.missions.every((m,mi)=>G.cleared[ci+'-'+mi]))){
      G.allClear=true;
      setTimeout(()=>HUD.toast('무한 모드 해금!'),2500);
    }
    setTimeout(()=>showEnd(true,stars,null,gold),1100);
  },
  fail(reason){
    if(this.state!=='playing')return;
    this.state='failed';
    Music.setState('CALM');AE.failSnd();AE.heartbeat(false);
    HUD.timer(null);HUD.hint(null);
    $('btnPause').classList.add('hide');
    if(this.mode==='endless'){
      G.stats.bestWave=Math.max(G.stats.bestWave,this.wave);
      setTimeout(()=>showEnd(false,0,'WAVE '+this.wave+'에서 전사 (최고 기록 '+G.stats.bestWave+')'),1000);
      return;
    }
    setTimeout(()=>showEnd(false,0,reason),1000);
  },
  restart(){
    if(this.mode==='tutorial')this.beginTutorial();
    else if(this.mode==='endless')this.beginEndless();
    else this.begin(this.ci,this.mi);
  },
};
/* =====================================================================
   씬 / 렌더러 / 하늘 / 조명
   ===================================================================== */
let renderer,scene,camera,sunLight,hemi,skyMat,groundMat,world;
let timeScale=1,paused=false,ready=false,envFx=[];
function init3D(){
  renderer=new THREE.WebGLRenderer({canvas:$('c'),antialias:false}); // 픽셀아트: AA 끔
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(innerWidth,innerHeight);
  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=THREE.PCFShadowMap;
  scene=new THREE.Scene();
  scene.fog=new THREE.Fog(0xc58a7a,80,280);
  camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.05,900);
  scene.add(camera);
  hemi=new THREE.HemisphereLight(0xcfd8ff,0x5a4a3a,.85);scene.add(hemi);
  sunLight=new THREE.DirectionalLight(0xffe8c0,1.15);
  sunLight.position.set(45,70,35);
  sunLight.castShadow=true;
  sunLight.shadow.mapSize.set(1024,1024);       // shadowMap 1024
  sunLight.shadow.camera.left=-70;sunLight.shadow.camera.right=70;
  sunLight.shadow.camera.top=90;sunLight.shadow.camera.bottom=-70;
  sunLight.shadow.camera.far=260;
  sunLight.shadow.bias=-0.0015;                  // acne 방지
  sunLight.shadow.normalBias=.03;
  scene.add(sunLight);scene.add(sunLight.target);
  // 하늘: 구체 내부 셰이더 그라데이션 + 픽셀 태양 + 야간 별
  skyMat=new THREE.ShaderMaterial({
    side:THREE.BackSide,depthWrite:false,fog:false,
    uniforms:{
      uTop:{value:new THREE.Color(0x2a1a4a)},uMid:{value:new THREE.Color(0xb8506a)},
      uBot:{value:new THREE.Color(0xff9a4a)},uSunCol:{value:new THREE.Color(0xffd94d)},
      uSun:{value:V3(.42,.34,-.84).normalize()},uNight:{value:0},
    },
    vertexShader:'varying vec3 vP;void main(){vP=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}',
    fragmentShader:`
      uniform vec3 uTop,uMid,uBot,uSunCol,uSun;uniform float uNight;varying vec3 vP;
      float hash(vec3 p){return fract(sin(dot(p,vec3(12.9898,78.233,45.164)))*43758.5453);}
      void main(){
        vec3 d=normalize(vP);
        vec3 col=mix(uBot,uMid,smoothstep(-.06,.22,d.y));
        col=mix(col,uTop,smoothstep(.22,.75,d.y));
        vec3 r=normalize(cross(vec3(0.,1.,0.),uSun));vec3 u=cross(uSun,r);
        float ang=dot(d,uSun);
        if(ang>0.){
          vec2 p=vec2(dot(d,r),dot(d,u));
          float m=max(abs(p.x),abs(p.y));
          col=mix(col,uSunCol,step(m,.038));               // 픽셀(사각) 태양
          col+=uSunCol*.3*smoothstep(.11,.038,m);
        }
        if(uNight>.5){
          vec3 g=floor(d*90.);
          float s=step(.9975,hash(g));
          col+=vec3(s*.8*(.5+.5*hash(g+1.)));
        }
        gl_FragColor=vec4(col,1.);
      }`,
  });
  scene.add(new THREE.Mesh(new THREE.SphereGeometry(600,24,16),skyMat));
  // 지평선 지면 (필드 밖)
  const gTex=noiseTex(['#4d8f3a','#57a044','#468234','#5a9a45'],{seed:44});
  gTex.wrapS=gTex.wrapT=THREE.RepeatWrapping;gTex.repeat.set(220,220);
  groundMat=new THREE.MeshLambertMaterial({map:gTex});
  const ground=new THREE.Mesh(new THREE.PlaneGeometry(1200,1200),groundMat);
  ground.rotation.x=-Math.PI/2;ground.position.y=0;ground.receiveShadow=true;
  scene.add(ground);
}
function applyEnv(env){
  skyMat.uniforms.uTop.value.setHex(env.top);
  skyMat.uniforms.uMid.value.setHex(env.mid);
  skyMat.uniforms.uBot.value.setHex(env.bot);
  skyMat.uniforms.uSunCol.value.setHex(env.sun);
  skyMat.uniforms.uNight.value=env.night?1:0;
  scene.fog.color.setHex(env.fog);
  scene.fog.near=env.night?25:80;
  scene.fog.far=env.night?110:280;               // 야간 시야 제한
  hemi.intensity=env.amb;
  sunLight.intensity=env.night?.22:1.15;
  sunLight.color.setHex(env.night?0x8098d8:0xffe8c0);
  groundMat.color.setHex(env.desert?0xd8c088:env.night?0x40486a:0xffffff);
  // 이전 환경 이펙트 제거
  envFx.forEach(f=>scene.remove(f.grp));envFx=[];
  if(env.night){ // 모닥불 2개 — 적 추적의 광원
    for(let i=0;i<2;i++){
      const grp=new THREE.Group();
      const x=rand(-22,22),z=rand(-24,6),y=world.surfaceY(x,z);
      for(let k=0;k<3;k++){const log=new THREE.Mesh(addWhiteColor(new THREE.BoxGeometry(.9,.22,.22)),MATS[MI.log]);
        log.rotation.y=k*1.05;log.position.y=.12;grp.add(log);}
      const fl=new THREE.Mesh(new THREE.BoxGeometry(.4,.5,.4),new THREE.MeshBasicMaterial({color:0xffa030}));
      fl.position.y=.4;grp.add(fl);
      const li=new THREE.PointLight(0xff9030,2.2,16);li.position.y=1;grp.add(li);
      grp.position.set(x,y,z);scene.add(grp);
      envFx.push({grp,li,fl,t:rand(9)});
    }
  }
}
/* 야간 손전등: 적 스폰 후킹 */
const _spawnOrig=EnemyMgr.spawn.bind(EnemyMgr);
EnemyMgr.spawn=function(type,x,z,opts){
  const e=_spawnOrig(type,x,z,opts);
  if(QM.night){
    const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:PS.flashMesh.material.map,color:0xffe9a0,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));
    sp.scale.setScalar(.9);sp.position.set(.2,1.05,-.6);e.group.add(sp);
    const cone=new THREE.Mesh(new THREE.ConeGeometry(.5,3.4,6,1,true),
      new THREE.MeshBasicMaterial({color:0xffe9a0,transparent:true,opacity:.09,side:THREE.DoubleSide,depthWrite:false}));
    cone.rotation.x=-Math.PI/2;cone.position.set(.2,1.0,-2.3);e.group.add(cone);
  }
  return e;
};
/* =====================================================================
   화면 전환 & 메뉴 UI
   ===================================================================== */
const SCREENS=['scrTitle','scrMenu','scrShop','scrSettings','scrStats','scrEnd','scrPause'];
function showScreen(id){
  SCREENS.forEach(s=>$(s).classList.toggle('hide',s!==id));
  $('hud').style.visibility=id&&id!=='scrPause'?'hidden':'visible';
}
let selCh=0,setBack='scrMenu';
function renderMenu(){
  $('goldTxt').textContent='● '+G.gold+' G';
  const tabs=$('chapTabs');tabs.innerHTML='';
  CHAPTERS.forEach((c,i)=>{
    const locked=totalStars()<c.gate;
    const b=document.createElement('button');
    b.className='chapTab'+(i===selCh?' sel':'')+(locked?' lock':'');
    b.textContent=(i+1)+'장'+(locked?' 🔒':'');
    b.onclick=()=>{AE.click();if(locked){HUD.toast('별 '+c.gate+'개 필요 (현재 '+totalStars()+'개)');return;}selCh=i;renderMenu();};
    tabs.appendChild(b);
  });
  const list=$('missionList');list.innerHTML='';
  const ch=CHAPTERS[selCh];
  const chLocked=totalStars()<ch.gate;
  ch.missions.forEach((m,mi)=>{
    const key=selCh+'-'+mi,st=G.stars[key]||0;
    const card=document.createElement('button');
    card.className='miCard';
    card.innerHTML='<span>'+m.n+'<small>'+m.desc.split('\n')[0]+' · 별 조건 '+m.par+'초</small></span>'
      +'<span class="stars">'+'★'.repeat(st)+'<span style="color:#555">'+'★'.repeat(3-st)+'</span></span>';
    card.onclick=()=>{if(chLocked)return;AE.click();QM.begin(selCh,mi);};
    list.appendChild(card);
  });
  $('btnEndless').classList.toggle('hide',!G.allClear);
}
function renderShop(){
  $('goldTxt2').textContent='● '+G.gold+' G';
  const list=$('shopList');list.innerHTML='';
  SHOP.forEach(it=>{
    const owned=!!G.up[it.k];
    const row=document.createElement('div');row.className='shopItem';
    row.innerHTML='<span>'+it.n+'<small>'+it.d+'</small></span>';
    const btn=document.createElement('button');
    btn.className='buyBtn'+(owned?' owned':'');
    btn.textContent=owned?'보유중':it.p+' G';
    btn.disabled=owned||G.gold<it.p;
    btn.onclick=()=>{
      if(owned||G.gold<it.p)return;
      G.gold-=it.p;G.up[it.k]=1;AE.coin();AE.star(1);
      HUD.toast(it.n+' 구매!');renderShop();
    };
    row.appendChild(btn);list.appendChild(row);
  });
}
function renderStats(){
  const st=G.stats,acc=st.shots?st.hits/st.shots:0,hs=st.kills?st.heads/st.kills:0;
  const score=acc*50+hs*50;
  $('rankBig').textContent=score>=70?'S':score>=55?'A':score>=40?'B':'C';
  $('statGrid').innerHTML=
    '<span>총 킬</span><b>'+st.kills+'</b><span>헤드샷률</span><b>'+(hs*100|0)+'%</b>'
    +'<span>명중률</span><b>'+(acc*100|0)+'%</b><span>최장 거리</span><b>'+st.longest+'m</b>'
    +'<span>파괴한 블록</span><b>'+st.blocks+'</b><span>최고 웨이브</span><b>'+st.bestWave+'</b>'
    +'<span>누적 별</span><b>'+totalStars()+' / '+CHAPTERS.reduce((a,c)=>a+c.missions.length*3,0)+'</b>'
    +'<span>골드</span><b>'+G.gold+' G</b>';
}
function showEnd(won,stars,msg,gold){
  showScreen('scrEnd');
  $('endTitle').textContent=won?'임무 완수':'임무 실패';
  $('endTitle').style.color=won?'#ffb830':'#ff5544';
  const fr=$('failReason');
  if(!won&&msg){fr.classList.remove('hide');fr.textContent='실패 원인: '+msg;}
  else if(msg){fr.classList.remove('hide');fr.style.color='#7dda58';fr.textContent=msg;}
  else fr.classList.add('hide');
  const es=$('endStars');es.innerHTML='';
  if(won&&QM.mode==='mission'){
    for(let i=0;i<3;i++){
      const sp=document.createElement('span');sp.textContent='★';es.appendChild(sp);
      if(i<stars)setTimeout(()=>{sp.className='got';AE.star(i);},500+i*420); // 별 획득 피치 상승
    }
  }
  const ms=QM.ms,acc=ms.shots?(ms.hits/ms.shots*100|0):0;
  $('endStats').innerHTML=(QM.mode==='mission'?
    '시간 '+ms.t.toFixed(1)+'초 (별 조건 '+QM.m.par+'초) · 명중률 '+acc+'% · 피격 '+ms.dmg+'회<br>':'')
    +'킬 '+ms.kills+' · 헤드샷 '+ms.heads+(gold?'<br><span style="color:#ffd94d">+'+gold+' G 획득</span>':'');
  // 다음 임무 버튼
  const nx=$('btnNext');nx.classList.add('hide');
  if(won&&QM.mode==='mission'){
    let nc=QM.ci,nm=QM.mi+1;
    if(nm>=CHAPTERS[nc].missions.length){nc++;nm=0;}
    if(nc<CHAPTERS.length&&totalStars()>=CHAPTERS[nc].gate){
      nx.classList.remove('hide');
      nx.onclick=()=>{AE.click();QM.begin(nc,nm);};
    }
  }
  if(won&&QM.mode==='tutorial'){
    nx.classList.remove('hide');nx.textContent='작전 개시 ▶';
    nx.onclick=()=>{AE.click();renderMenu();showScreen('scrMenu');};
  }
}
function pauseGame(){
  if(paused||QM.state!=='playing')return;
  paused=true;AE.suspend();showScreen('scrPause');
}
function resumeGame(){paused=false;AE.resume();showScreen(null);}
function wireUI(){
  $('scrTitle').addEventListener('pointerdown',()=>{
    AE.init();AE.resume();Music.start();AE.click();
    if(!G.tutorialDone)QM.beginTutorial();
    else{renderMenu();showScreen('scrMenu');}
  },{once:false});
  $('btnShop').onclick=()=>{AE.click();renderShop();showScreen('scrShop');};
  $('btnShopBack').onclick=()=>{AE.click();renderMenu();showScreen('scrMenu');};
  $('btnStats').onclick=()=>{AE.click();renderStats();showScreen('scrStats');};
  $('btnStatsBack').onclick=()=>{AE.click();renderMenu();showScreen('scrMenu');};
  $('btnSettings').onclick=()=>{AE.click();setBack='scrMenu';showScreen('scrSettings');};
  $('btnSetBack').onclick=()=>{AE.click();
    if(setBack==='scrPause')showScreen('scrPause');
    else{renderMenu();showScreen('scrMenu');}};
  $('btnEndless').onclick=()=>{AE.click();QM.beginEndless();};
  $('btnRetry').onclick=()=>{AE.click();QM.restart();};        // 로딩 없이 즉시 재시도
  $('btnToMenu').onclick=()=>{AE.click();QM.state='idle';renderMenu();showScreen('scrMenu');};
  $('btnResume').onclick=()=>{AE.click();resumeGame();};
  $('btnPauseRetry').onclick=()=>{AE.click();paused=false;AE.resume();QM.restart();};
  $('btnPauseSet').onclick=()=>{AE.click();setBack='scrPause';showScreen('scrSettings');};
  $('btnQuit').onclick=()=>{AE.click();paused=false;AE.resume();QM.state='idle';renderMenu();showScreen('scrMenu');};
  // 설정 바인딩
  $('setSens').oninput=e=>S.sens=e.target.value/100;
  $('setMus').oninput=e=>{S.musicVol=e.target.value/100;AE.setVols();};
  $('setSfx').oninput=e=>{S.sfxVol=e.target.value/100;AE.setVols();};
  const seg=(id,fn)=>{const el=$(id);el.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    el.querySelectorAll('button').forEach(x=>x.classList.remove('sel'));
    b.classList.add('sel');fn(+b.dataset.v);AE.click();});};
  seg('setAssist',v=>S.assist=v);
  seg('setVib',v=>S.vib=!!v);
  seg('setLefty',v=>{S.lefty=!!v;document.body.classList.toggle('lefty',S.lefty);});
  seg('setFps',v=>S.fps30=!!v);
  // 백그라운드 → 자동 일시정지 + 오디오 suspend
  document.addEventListener('visibilitychange',()=>{
    if(document.hidden){AE.suspend();if(QM.state==='playing'&&!paused)pauseGame();}
    else if(!paused)AE.resume();
  });
  const onResize=()=>{
    renderer.setSize(innerWidth,innerHeight);
    camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  };
  window.addEventListener('resize',onResize);
  window.addEventListener('orientationchange',()=>setTimeout(onResize,300));
}
/* =====================================================================
   메인 루프
   ===================================================================== */
const _frustum=new THREE.Frustum(),_pv=new THREE.Matrix4();
let _last=performance.now(),_acc30=0;
function frame(now){
  requestAnimationFrame(frame);
  let dt=Math.min((now-_last)/1000,.06);_last=now;
  if(!ready)return;
  if(S.fps30){_acc30+=dt;if(_acc30<1/31)return;dt=Math.min(_acc30,.08);_acc30=0;} // 절전 모드
  if(paused)return;
  const dts=dt*timeScale;
  if(QM.state==='playing'){
    input.tick(dt);
    player.update(dt);
    weapon.update(dt,input.lookVX,input.lookVY);
    updateBullets(dts);
    EnemyMgr.update(dts);
    QM.update(dt);
  }
  world.update(dts);
  PS.update(dts);
  world.flush();
  HUD.windAnim(now/1000);
  for(const f of envFx){f.t+=dt;f.li.intensity=2+Math.sin(f.t*11)*.5+Math.sin(f.t*23)*.3;
    f.fl.scale.y=1+Math.sin(f.t*13)*.25;}
  _pv.multiplyMatrices(camera.projectionMatrix,camera.matrixWorldInverse);
  _frustum.setFromProjectionMatrix(_pv);
  world.cull(camera,_frustum);
  renderer.render(scene,camera);
}
/* =====================================================================
   부트스트랩
   ===================================================================== */
function boot(){
  if(!window.THREE){
    $('titleTap').textContent='Three.js 로드 실패 — 네트워크를 확인하세요';
    $('fadeBlack').style.opacity=0;return;
  }
  buildMaterials();buildBlockGeo();buildMercSkins();buildTargetMats();drawLogo();
  init3D();
  world=new BlockWorld();scene.add(world.group);
  PS.init(scene);EnemyMgr.init(scene);
  world.generate(4242,{}); // 타이틀 배경
  applyEnv(CH_ENV[0]);
  player.reset();
  weapon.init(camera);
  input.init();HUD.init();wireUI();
  camera.position.copy(player.eyePos());
  ready=true;
  showScreen('scrTitle');
  $('fadeBlack').style.opacity=0;
  requestAnimationFrame(frame);
}
boot();
